<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="K-12 Cybersecurity Toolkit">
  <defs>
    <!-- Background gradient: deep navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
    <!-- Top accent line: red gradient (KVKK theme) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C42B1C" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C42B1C" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Shield highlight gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Grid pattern: subtle network feel -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.06"/>
    </pattern>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Decorative dot pattern (top right corner) -->
  <g opacity="0.15">
    <circle cx="1050" cy="40" r="2" fill="#4A90E2"/>
    <circle cx="1080" cy="40" r="2" fill="#4A90E2"/>
    <circle cx="1110" cy="40" r="2" fill="#4A90E2"/>
    <circle cx="1140" cy="40" r="2" fill="#4A90E2"/>
    <circle cx="1050" cy="70" r="2" fill="#4A90E2"/>
    <circle cx="1080" cy="70" r="2" fill="#4A90E2"/>
    <circle cx="1110" cy="70" r="2" fill="#4A90E2"/>
    <circle cx="1050" cy="100" r="2" fill="#4A90E2"/>
    <circle cx="1080" cy="100" r="2" fill="#4A90E2"/>
  </g>

  <!-- Top accent line -->
  <rect y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- Bottom accent line -->
  <rect y="355" width="1200" height="5" fill="url(#accent)" opacity="0.5"/>

  <!-- ===== Main Title ===== -->
  <text x="60" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#4A90E2" letter-spacing="2">
    AÇIK KAYNAK · OPEN SOURCE
  </text>

  <text x="60" y="170" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    K-12 Cybersecurity Toolkit
  </text>

  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B8CCE0">
    Türk Okulları için Açık Kaynak Siber Güvenlik &amp; KVKK Uyum Çerçevesi
  </text>

  <!-- Divider line under subtitle -->
  <line x1="60" y1="240" x2="180" y2="240" stroke="#E74C3C" stroke-width="3"/>

  <!-- ===== Framework Badges ===== -->
  <g transform="translate(60, 280)">
    <!-- NIST CSF 2.0 -->
    <g>
      <rect x="0" y="0" width="142" height="38" rx="19" fill="#1F4E78" stroke="#4A90E2" stroke-width="1"/>
      <text x="71" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">NIST CSF 2.0</text>
    </g>
    <!-- KVKK -->
    <g transform="translate(154, 0)">
      <rect x="0" y="0" width="92" height="38" rx="19" fill="#C42B1C" stroke="#E74C3C" stroke-width="1"/>
      <text x="46" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">KVKK</text>
    </g>
    <!-- CIS Controls v8 -->
    <g transform="translate(258, 0)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#2E7D5B" stroke="#3FA976" stroke-width="1"/>
      <text x="75" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CIS Controls v8</text>
    </g>
    <!-- ISO 27001 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="112" height="38" rx="19" fill="#7030A0" stroke="#9D5BCF" stroke-width="1"/>
      <text x="56" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ISO 27001</text>
    </g>
    <!-- Türkçe with mini Turkish flag drawn as SVG -->
    <g transform="translate(544, 0)">
      <rect x="0" y="0" width="100" height="38" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
      <!-- Mini Turkish flag -->
      <g transform="translate(10, 11)">
        <rect x="0" y="0" width="22" height="16" rx="2" fill="#E30A17"/>
        <circle cx="9" cy="8" r="4" fill="#FFFFFF"/>
        <circle cx="10.5" cy="8" r="3.2" fill="#E30A17"/>
        <polygon points="14.5,8 12.5,8.8 13.3,7 12.5,5.2 14.5,6 16,5 15,6.7 16.2,8" fill="#FFFFFF" transform="scale(0.45) translate(18,8)"/>
      </g>
      <text x="62" y="24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0A2540" text-anchor="middle">Türkçe</text>
    </g>
  </g>

  <!-- ===== Shield + School Icon on Right ===== -->
  <g transform="translate(870, 50)" filter="url(#glow)">
    <!-- Shield outline -->
    <path d="M 130 0
             L 250 30
             L 250 150
             Q 250 220 130 270
             Q 10 220 10 150
             L 10 30 Z"
          fill="url(#shieldGrad)"
          stroke="#4A90E2"
          stroke-width="2.5"/>

    <!-- Inner shield border -->
    <path d="M 130 18
             L 232 42
             L 232 148
             Q 232 208 130 250
             Q 28 208 28 148
             L 28 42 Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1"
          opacity="0.3"/>

    <!-- School building icon inside shield -->
    <g transform="translate(80, 95)">
      <!-- Roof -->
      <polygon points="50,0 95,30 5,30" fill="#FFFFFF"/>
      <!-- Flag pole on roof -->
      <line x1="50" y1="0" x2="50" y2="-15" stroke="#FFFFFF" stroke-width="2"/>
      <!-- Building body -->
      <rect x="10" y="30" width="80" height="55" fill="#FFFFFF"/>
      <!-- Door -->
      <rect x="42" y="55" width="16" height="30" fill="#0A2540"/>
      <!-- Door knob -->
      <circle cx="54" cy="70" r="1.2" fill="#FFFFFF"/>
      <!-- Windows -->
      <rect x="20" y="42" width="14" height="12" fill="#4A90E2"/>
      <rect x="66" y="42" width="14" height="12" fill="#4A90E2"/>
      <line x1="27" y1="42" x2="27" y2="54" stroke="#FFFFFF" stroke-width="0.5"/>
      <line x1="20" y1="48" x2="34" y2="48" stroke="#FFFFFF" stroke-width="0.5"/>
      <line x1="73" y1="42" x2="73" y2="54" stroke="#FFFFFF" stroke-width="0.5"/>
      <line x1="66" y1="48" x2="80" y2="48" stroke="#FFFFFF" stroke-width="0.5"/>
    </g>

    <!-- Lock icon at top of shield -->
    <g transform="translate(115, 50)">
      <rect x="0" y="8" width="30" height="22" rx="3" fill="#E74C3C" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M 5 8 L 5 4 Q 5 -2 15 -2 Q 25 -2 25 4 L 25 8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="15" cy="19" r="2.5" fill="#FFFFFF"/>
      <rect x="14" y="19" width="2" height="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== Bottom right: Author tag ===== -->
  <text x="1140" y="335" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#7A8FA8" text-anchor="end">
    haydarkozat · MIT License
  </text>
</svg>
